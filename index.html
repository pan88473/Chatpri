<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MiniChat Ventana</title>
<style>
  :root {
    --bg-alpha: 0.35;
    --my-msg: rgba(0, 175, 85, 0.62);
    --other-msg: rgba(25, 25, 25, 0.72);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, var(--bg-alpha));
    color: #fff;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
  }

  /* Barra superior compacta */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 8px;
    background: rgba(0, 0, 0, 0.65);
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    font-size: 12px;
    flex-shrink: 0;
  }

  .status-wrap {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  #status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ff5252;
    display: inline-block;
  }

  .top-btn {
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #fff;
    padding: 3px 7px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
  }

  /* Contenedor del chat */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .msg {
    max-width: 82%;
    padding: 6px 9px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.25;
    word-wrap: break-word;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }

  .msg.me {
    align-self: flex-end;
    background: var(--my-msg);
    border-bottom-right-radius: 2px;
  }

  .msg.other {
    align-self: flex-start;
    background: var(--other-msg);
    border-bottom-left-radius: 2px;
  }

  .sender {
    font-size: 10px;
    color: #ffd54f;
    margin-bottom: 2px;
    font-weight: bold;
  }

  .time {
    font-size: 9px;
    opacity: 0.75;
    text-align: right;
    margin-top: 2px;
  }

  /* Stickers en el chat */
  .sticker-img {
    width: 88px;
    height: 88px;
    object-fit: contain;
    display: block;
  }

  /* Botón de audio ligero */
  .audio-btn {
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.4);
    color: #fff;
    padding: 5px 10px;
    border-radius: 15px;
    font-size: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-top: 2px;
  }

  /* Panel de Stickers */
  #sticker-panel {
    display: none;
    background: rgba(15, 15, 15, 0.92);
    border-top: 1px solid rgba(255, 255, 255, 0.2);
    padding: 6px;
    max-height: 150px;
    overflow-y: auto;
  }

  .sticker-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
    gap: 6px;
    align-items: center;
  }

  .sticker-item {
    width: 52px;
    height: 52px;
    object-fit: contain;
    cursor: pointer;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.06);
    padding: 2px;
  }

  .add-sticker-bar {
    display: flex;
    gap: 4px;
    margin-top: 6px;
  }

  .add-sticker-bar input[type="text"] {
    flex: 1;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #fff;
    padding: 4px 6px;
    border-radius: 4px;
    font-size: 11px;
    min-width: 0;
  }

  /* Barra inferior */
  footer {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 5px;
    background: rgba(0, 0, 0, 0.72);
    border-top: 1px solid rgba(255, 255, 255, 0.15);
    flex-shrink: 0;
  }

  #text-input {
    flex: 1;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #fff;
    padding: 7px 9px;
    border-radius: 16px;
    font-size: 13px;
    outline: none;
    min-width: 0;
  }

  #text-input::placeholder {
    color: rgba(255, 255, 255, 0.65);
  }

  .icon-btn {
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #fff;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .icon-btn.recording {
    background: #ff1744;
    border-color: #ff8a80;
  }

  .icon-btn.cancel {
    background: #555;
    display: none;
    font-size: 13px;
  }

  .icon-btn.send {
    background: #00c853;
    border-color: #69f0ae;
  }
</style>
</head>
<body>

<header>
  <div class="status-wrap">
    <span id="status-dot" title="Estado de conexión"></span>
    <button class="top-btn" onclick="changeName()" id="user-btn">👤 Nombre</button>
  </div>
  <div style="display:flex; gap:4px;">
    <button class="top-btn" onclick="toggleAlpha()" title="Cambiar transparencia">👁️ Fondo</button>
    <button class="top-btn" onclick="clearChat()" title="Borrar mensajes">🗑️</button>
  </div>
</header>

<div id="chat"></div>

<!-- Panel de Stickers -->
<div id="sticker-panel">
  <div class="sticker-grid" id="sticker-list"></div>
  <div class="add-sticker-bar">
    <label class="top-btn" style="display:flex; align-items:center;">
      📁 Foto
      <input type="file" id="sticker-file" accept="image/*" style="display:none" onchange="uploadStickerFile(event)">
    </label>
    <input type="text" id="sticker-url" placeholder="O pega link de GIF/imagen...">
    <button class="top-btn" onclick="addNewSticker()">+ Link</button>
  </div>
</div>

<footer>
  <button class="icon-btn" onclick="toggleStickers()">😊</button>
  <input type="text" id="text-input" placeholder="Mensaje..." autocomplete="off">
  <button class="icon-btn cancel" id="cancel-mic-btn" onclick="cancelRecord()" title="Cancelar audio">✖</button>
  <button class="icon-btn" id="mic-btn" onclick="toggleRecord()">🎤</button>
  <button class="icon-btn send" onclick="sendText()">➤</button>
</footer>

<!-- Firebase SDK Ligero -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  // ==========================================
  // TU CONFIGURACIÓN DE FIREBASE INTEGRADA
  // ==========================================
  const firebaseConfig = {
    apiKey: "AIzaSyActs50ep97GXZ-zEBpeEbXG6XrChGKOYs",
    authDomain: "chat-d9a84.firebaseapp.com",
    databaseURL: "https://chat-d9a84-default-rtdb.firebaseio.com",
    projectId: "chat-d9a84",
    storageBucket: "chat-d9a84.firebasestorage.app",
    messagingSenderId: "1017387007400",
    appId: "1:1017387007400:web:57e1da1518c9b451fef19d",
    measurementId: "G-R1TJDCQ2WQ"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Rutas separadas para no mezclarse con tu otro proyecto
  const chatRef = db.ref("aweb_chat_v1/mensajes");
  const stickersRef = db.ref("aweb_chat_v1/stickers");

  // Indicador de conexión en vivo
  const statusDot = document.getElementById("status-dot");
  db.ref(".info/connected").on("value", (snap) => {
    statusDot.style.background = (snap.val() === true) ? "#00e676" : "#ff5252";
  });

  // Usuario y transparencia
  let myName = localStorage.getItem("aweb_chat_user") || "Sam";
  document.getElementById("user-btn").textContent = "👤 " + myName;

  let alphaLevels = [0.35, 0.05, 0.78];
  let alphaIdx = 0;

  function changeName() {
    const nuevo = prompt("Tu nombre en el chat:", myName);
    if (nuevo && nuevo.trim()) {
      myName = nuevo.trim();
      localStorage.setItem("aweb_chat_user", myName);
      document.getElementById("user-btn").textContent = "👤 " + myName;
    }
  }

  function toggleAlpha() {
    alphaIdx = (alphaIdx + 1) % alphaLevels.length;
    document.documentElement.style.setProperty('--bg-alpha', alphaLevels[alphaIdx]);
  }

  function getTime() {
    const d = new Date();
    return d.getHours().toString().padStart(2, '0') + ":" + d.getMinutes().toString().padStart(2, '0');
  }

  // ==========================================
  // MENSAJES EN TIEMPO REAL (MÁXIMO 25 EN PANTALLA)
  // ==========================================
  const chatBox = document.getElementById("chat");
  const textInput = document.getElementById("text-input");

  textInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendText();
  });

  function sendText() {
    const txt = textInput.value.trim();
    if (!txt) return;
    chatRef.push({
      user: myName,
      type: "text",
      content: txt,
      time: getTime()
    });
    textInput.value = "";
  }

  function clearChat() {
    if (confirm("¿Limpiar los mensajes para ambos?")) {
      chatRef.remove();
    }
  }

  chatRef.limitToLast(25).on("child_added", (snap) => {
    const data = snap.val();
    const div = document.createElement("div");
    div.id = "msg-" + snap.key;
    div.className = "msg " + (data.user === myName ? "me" : "other");

    let bodyHTML = "";
    if (data.type === "text") {
      bodyHTML = `<div>${escapeHTML(data.content)}</div>`;
    } else if (data.type === "sticker") {
      bodyHTML = `<img class="sticker-img" src="${escapeHTML(data.content)}" loading="lazy">`;
    } else if (data.type === "audio") {
      bodyHTML = `<button class="audio-btn" onclick="playAudio(this, '${data.content}')">▶ Escuchar audio</button>`;
    }

    div.innerHTML = `
      <div class="sender">${escapeHTML(data.user)}</div>
      ${bodyHTML}
      <div class="time">${data.time || ""}</div>
    `;

    chatBox.appendChild(div);
    while (chatBox.children.length > 25) {
      chatBox.removeChild(chatBox.firstChild);
    }
    chatBox.scrollTop = chatBox.scrollHeight;
  });

  chatRef.on("value", (snap) => {
    if (!snap.exists()) chatBox.innerHTML = "";
  });

  function escapeHTML(str) {
    return String(str).replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  // ==========================================
  // AUDIO LIGERO CON OPCIÓN DE CANCELAR
  // ==========================================
  let currentAudio = null;

  function playAudio(btn, base64Data) {
    if (currentAudio) {
      currentAudio.pause();
      currentAudio = null;
    }
    currentAudio = new Audio(base64Data);
    btn.textContent = "🔊 Reproduciendo...";
    currentAudio.play();
    currentAudio.onended = () => {
      btn.textContent = "▶ Escuchar audio";
    };
  }

  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;
  let cancelAudioFlag = false;
  const micBtn = document.getElementById("mic-btn");
  const cancelMicBtn = document.getElementById("cancel-mic-btn");

  async function toggleRecord() {
    if (!isRecording) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        try {
          mediaRecorder = new MediaRecorder(stream, { audioBitsPerSecond: 16000 });
        } catch (e) {
          mediaRecorder = new MediaRecorder(stream);
        }
        audioChunks = [];
        cancelAudioFlag = false;

        mediaRecorder.ondataavailable = e => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          if (cancelAudioFlag) return;

          const blob = new Blob(audioChunks, { type: "audio/webm" });
          const reader = new FileReader();
          reader.onloadend = () => {
            chatRef.push({
              user: myName,
              type: "audio",
              content: reader.result,
              time: getTime()
            });
          };
          reader.readAsDataURL(blob);
        };

        mediaRecorder.start();
        isRecording = true;
        micBtn.classList.add("recording");
        micBtn.textContent = "⏹️";
        cancelMicBtn.style.display = "flex";
        textInput.placeholder = "Grabando... ⏹️ envía / ✖ cancela";
      } catch (err) {
        alert("Activa el permiso de micrófono para AWeb Window en los Ajustes de tu celular.");
      }
    } else {
      mediaRecorder.stop();
      resetMicUI();
    }
  }

  function cancelRecord() {
    if (isRecording && mediaRecorder) {
      cancelAudioFlag = true;
      mediaRecorder.stop();
      resetMicUI();
    }
  }

  function resetMicUI() {
    isRecording = false;
    micBtn.classList.remove("recording");
    micBtn.textContent = "🎤";
    cancelMicBtn.style.display = "none";
    textInput.placeholder = "Mensaje...";
  }

  // ==========================================
  // STICKERS (POR LINK O DESDE GALERÍA)
  // ==========================================
  const defaultStickers = [
    "https://fonts.gstatic.com/s/e/notoemoji/latest/1f60d/512.webp",
    "https://fonts.gstatic.com/s/e/notoemoji/latest/1f970/512.webp",
    "https://fonts.gstatic.com/s/e/notoemoji/latest/1f602/512.webp",
    "https://fonts.gstatic.com/s/e/notoemoji/latest/1f62d/512.webp",
    "https://fonts.gstatic.com/s/e/notoemoji/latest/1f525/512.webp",
    "https://fonts.gstatic.com/s/e/notoemoji/latest/2764_fe0f/512.webp"
  ];

  const stickerPanel = document.getElementById("sticker-panel");
  const stickerList = document.getElementById("sticker-list");

  function toggleStickers() {
    stickerPanel.style.display = (stickerPanel.style.display === "block") ? "none" : "block";
  }

  function renderSticker(url) {
    const img = document.createElement("img");
    img.src = url;
    img.className = "sticker-item";
    img.onclick = () => {
      chatRef.push({
        user: myName,
        type: "sticker",
        content: url,
        time: getTime()
      });
      stickerPanel.style.display = "none";
    };
    stickerList.appendChild(img);
  }

  defaultStickers.forEach(renderSticker);

  stickersRef.limitToLast(30).on("child_added", snap => {
    renderSticker(snap.val().url);
  });

  function addNewSticker() {
    const input = document.getElementById("sticker-url");
    const url = input.value.trim();
    if (!url) return;
    stickersRef.push({ url: url });
    input.value = "";
  }

  // Convierte cualquier foto del celular en un sticker ultraligero (110x110px)
  function uploadStickerFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement("canvas");
        const maxSize = 110;
        let w = img.width;
        let h = img.height;
        if (w > h) {
          if (w > maxSize) { h *= maxSize / w; w = maxSize; }
        } else {
          if (h > maxSize) { w *= maxSize / h; h = maxSize; }
        }
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        const compressedDataUrl = canvas.toDataURL("image/webp", 0.75);
        stickersRef.push({ url: compressedDataUrl });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
</script>
</body>
</html>
